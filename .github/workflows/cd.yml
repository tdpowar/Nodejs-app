name: CD Pipeline

on:
  workflow_run:
    workflows: ["CI Pipeline"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted

    steps:
      - name: Deploy with Docker Compose
        run: |
          cd /home/ubuntu/nodejs-app
          sudo docker compose -f mongodb.yml pull
          sudo docker compose -f mongodb.yml up -d