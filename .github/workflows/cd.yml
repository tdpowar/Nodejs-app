name: CD Pipline

on:
  workflow_run:
    workflows: ["CI Pipline"]
    types:
      - completed

jobs:


  build:

    runs-on: self-hosted

    steps:
    - name: pull docker image 
      run: sudo docker pull tusharpowar/cicd-pipeline:latest
    - name: delete old docker container
      run: sudo docker rm -f cicd-pipeline-container || true
    - name: run docker container
      run: sudo docker run -d -p 8080:5050 --name cicd-pipeline-container tusharpowar/cicd-pipeline
    